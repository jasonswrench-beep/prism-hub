<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism Hub</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#desktop-heading">Skip to apps</a>
  <header class="top">
    <img class="suite-mark" src="brand/mark.svg" alt="" width="28" height="28">
    <span class="suite-name" id="suite-name"></span>
    <div class="menu-wrap">
      <button type="button" class="icon-btn" id="top-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="top-menu" aria-label="Settings menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1L14.5 2.8a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.7 8.8a.5.5 0 0 0 .1.6l2 1.6a7.8 7.8 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5a.5.5 0 0 0 .5.4H14a.5.5 0 0 0 .5-.4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12.1 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
      <div class="menu" id="top-menu" role="menu" aria-labelledby="top-menu-btn" hidden></div>
    </div>
  </header>

  <main id="home">
    <div id="banner"></div>
    <section aria-labelledby="desktop-heading">
      <h2 id="desktop-heading" tabindex="-1">Desktop</h2>
      <ul class="rows" id="desktop-list"></ul>
      <p class="empty" id="desktop-empty" hidden></p>
    </section>
    <section aria-labelledby="web-heading" id="web-section" hidden>
      <h2 id="web-heading">Web</h2>
      <ul class="rows" id="web-list"></ul>
    </section>
    <section aria-labelledby="coming-heading" id="coming-section" hidden>
      <h2 id="coming-heading">Coming soon</h2>
      <ul class="rows" id="coming-list"></ul>
    </section>
  </main>

  <main id="settings" hidden>
    <div class="settings-head">
      <button type="button" class="icon-btn" id="settings-back" aria-label="Back to apps">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
      </button>
      <h1 id="settings-heading" tabindex="-1">Settings</h1>
    </div>
    <div id="settings-body"></div>
  </main>

  <footer class="bottom">
    <div class="status" id="status" role="status"></div>
    <button type="button" class="link sibling" id="sibling"></button>
  </footer>

  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <div class="dialog-buttons" id="dialog-buttons"></div>
  </dialog>
</body>
</html>
