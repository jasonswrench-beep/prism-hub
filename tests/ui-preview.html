<!doctype html>
<!--
  The hub's window with a stand-in for the Rust side, for looking at it and testing it by keyboard and with a screen reader in a browser.
  Run "npm run dev" and open http://localhost:1430/tests/ui-preview.html. It is never part of the program: the build packs only index.html.
  The stand-in (ui-preview-stub.ts) shows every row state: current, update, open-and-needing-update, not installed, a problem, and Install
  running a pretend download with progress (it installs nothing).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub preview</title>
    <script type="module" src="/tests/ui-preview-stub.ts"></script>
  </head>
  <body></body>
</html>
