[package]
name = "prism-hub"
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Lists the PrismOpenResearch apps and installs, updates and opens each one from its signed GitHub release"

[lib]
name = "hub"
path = "src/lib.rs"

[[bin]]
name = "prism-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window, the tray icon and its two pictures (with and without the "update ready" dot).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# A second start (from the Start menu while the hub sits in the tray) shows the window of the first instead of a second hub.
tauri-plugin-single-instance = "2"
# The one Windows notification per new version.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SHA-256 of every downloaded installer, checked against the catalog.
sha2 = "0.10"
# The catalog's signature (Ed25519), checked with the public half of the hub key built into brand/brand.json.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

# Windows' own code for everything that touches the system: HTTPS (WinHTTP), the code-signature check (WinVerifyTrust), the per-user installed
# apps list and start-up entry (the registry), finding running programs, and opening a page or a folder.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
